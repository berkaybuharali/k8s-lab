---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcr-credential-sync
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gcr-credential-sync
  namespace: agents
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gcr-credential-sync
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gcr-credential-sync
subjects:
- kind: ServiceAccount
  name: gcr-credential-sync
  namespace: agents
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gcr-credential-sync
  namespace: agents
  labels:
    app: gcr-credential-sync
spec:
  schedule: "*/10 * * * *"  # Every 10 minutes
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: gcr-credential-sync
        spec:
          serviceAccountName: gcr-credential-sync
          restartPolicy: OnFailure
          containers:
          - name: sync
            image: alpine:latest
            command:
            - /bin/sh
            - -c
            - |
              #!/bin/sh
              set -e

              echo "GCR Credential Sync - $(date)"

              # Install curl and jq for API calls
              apk add --no-cache curl jq > /dev/null 2>&1

              REGISTRY="europe-west4-docker.pkg.dev"
              SECRET_NAME="artifact-registry"
              NAMESPACE="agents"
              K8S_API="https://kubernetes.default.svc"
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)

              # Get fresh token from metadata service
              TOKEN=$(curl -s -H "Metadata-Flavor: Google" \
                http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \
                | jq -r '.access_token')

              if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
                echo "ERROR: Failed to get token from metadata service"
                exit 1
              fi

              echo "Token fetched successfully"

              # Create docker config JSON and base64 encode
              DOCKER_CONFIG=$(echo -n "{\"auths\":{\"$REGISTRY\":{\"username\":\"oauth2accesstoken\",\"password\":\"$TOKEN\"}}}" | base64 | tr -d '\n')

              # Delete existing secret if it exists (fresh start each time)
              curl -sk -X DELETE \
                -H "Authorization: Bearer $SA_TOKEN" \
                "$K8S_API/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME" \
                > /dev/null 2>&1 || true

              # Create new secret with fresh token
              curl -sk -X POST \
                -H "Authorization: Bearer $SA_TOKEN" \
                -H "Content-Type: application/json" \
                "$K8S_API/api/v1/namespaces/$NAMESPACE/secrets" \
                -d "{
                  \"apiVersion\": \"v1\",
                  \"kind\": \"Secret\",
                  \"metadata\": {
                    \"name\": \"$SECRET_NAME\",
                    \"namespace\": \"$NAMESPACE\"
                  },
                  \"type\": \"kubernetes.io/dockerconfigjson\",
                  \"data\": {
                    \".dockerconfigjson\": \"$DOCKER_CONFIG\"
                  }
                }"

              echo "Secret $SECRET_NAME refreshed successfully"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 64Mi
