# Redis - Lightweight In-Memory Data Store
# Single replica with persistent storage for data durability.
# Data persists across pod restarts but is destroyed with cluster teardown.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: application
  labels:
    app: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: application
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  # Recreate strategy required for RWO volumes
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: redis
      annotations:
        # Velero backup hooks - Two methods available:
        # 1. Pod annotations (below, commented out) - Portable, follows the pod
        # 2. Centralized hooks file (configs/velero/backup-hooks.yaml) - Currently used
        #
        # Pod annotations take precedence over hooks file when both are defined.
        # Annotations are useful for production-critical databases or when deploying
        # to clusters where you don't control the central hooks configuration.
        #
        # Uncomment to use pod annotations instead of central hooks file:
        #
        # pre.hook.backup.velero.io/command: '["/usr/local/bin/redis-cli", "BGSAVE"]'
        # pre.hook.backup.velero.io/container: redis
        # pre.hook.backup.velero.io/timeout: 3m
        # pre.hook.backup.velero.io/on-error: Fail
        # post.hook.backup.velero.io/command: '["/usr/local/bin/redis-cli", "LASTSAVE"]'
        # post.hook.backup.velero.io/container: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
          # Enable RDB + AOF persistence for data durability
          # RDB: Point-in-time snapshots, fast restores
          # AOF: Log-based, better durability, synced every second
          args:
            - redis-server
            # RDB snapshotting
            - --save
            - "900 1"       # Save after 900s if 1 key changed
            - --save
            - "300 10"      # Save after 300s if 10 keys changed
            - --save
            - "60 10000"    # Save after 60s if 10000 keys changed
            # AOF persistence
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: application
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    app: redis
