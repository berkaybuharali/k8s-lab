# Velero Backup Hooks Reference
# -----------------------------------------------------------------------------
# This file shows example backup hooks for different databases.
# In this project, hooks are configured via pod annotations (see apps/redis.yaml).
#
# Alternative: Use this file with `velero backup create --hooks-file backup-hooks.yaml`
# for centralized hook management.
# -----------------------------------------------------------------------------

version: v1
kind: BackupHooks
hooks:
  # Redis: Force BGSAVE to persist in-memory data before snapshot
  - name: redis-bgsave
    labelSelector:
      matchLabels:
        app: redis
    pre:
      - exec:
          container: redis
          command: ["/usr/local/bin/redis-cli", "BGSAVE"]
          timeout: 3m
          onError: Fail
    post:
      - exec:
          container: redis
          command: ["/usr/local/bin/redis-cli", "LASTSAVE"]
          timeout: 1m
          onError: Continue

  # PostgreSQL: Checkpoint to flush WAL before snapshot (Option 1: Simple)
  - name: postgres-checkpoint
    labelSelector:
      matchLabels:
        app: postgres
    pre:
      - exec:
          container: postgres
          command: ["/usr/bin/psql", "-U", "postgres", "-c", "CHECKPOINT;"]
          timeout: 2m
          onError: Fail

  # PostgreSQL: Full dump to backup volume (Option 2: Safest)
  # Requires a backup PVC mounted at /backup
  - name: postgres-dump
    labelSelector:
      matchLabels:
        app: postgres
        backup-method: dump
    pre:
      - exec:
          container: postgres
          command:
            - /bin/bash
            - -c
            - |
              pg_dumpall -U postgres -f /backup/dump-$(date +%Y%m%d-%H%M%S).sql && \
              sync
          timeout: 15m
          onError: Fail
    post:
      - exec:
          container: postgres
          command:
            - /bin/bash
            - -c
            - |
              # Keep only last 3 dumps to save space
              cd /backup && ls -t dump-*.sql | tail -n +4 | xargs -r rm
          timeout: 1m
          onError: Continue

  # MySQL: Flush tables with read lock (use with caution - blocks writes)
  - name: mysql-flush
    labelSelector:
      matchLabels:
        app: mysql
    pre:
      - exec:
          container: mysql
          command:
            - /bin/bash
            - -c
            - |
              mysql -u root -p${MYSQL_ROOT_PASSWORD} -e "FLUSH TABLES WITH READ LOCK;" && \
              sleep 2
          timeout: 1m
          onError: Fail
    post:
      - exec:
          container: mysql
          command:
            - /bin/bash
            - -c
            - |
              mysql -u root -p${MYSQL_ROOT_PASSWORD} -e "UNLOCK TABLES;"
          timeout: 1m
          onError: Fail

  # Filesystem freeze (requires privileged container)
  - name: fsfreeze
    labelSelector:
      matchLabels:
        backup-method: fsfreeze
    pre:
      - exec:
          container: app
          command: ["/sbin/fsfreeze", "--freeze", "/data"]
          timeout: 30s
          onError: Fail
    post:
      - exec:
          container: app
          command: ["/sbin/fsfreeze", "--unfreeze", "/data"]
          timeout: 30s
          onError: Fail
