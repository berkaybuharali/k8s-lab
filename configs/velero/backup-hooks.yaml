# Velero Backup Hooks - Redis
#
# This file is automatically loaded by backup scripts if it exists.
# No environment variable configuration needed.
#
# These hooks ensure Redis data consistency during backups by forcing
# in-memory data to be persisted before the volume snapshot.

version: v1
kind: BackupHooks

hooks:
  # Redis: Force persistence before snapshot
  - name: redis-bgsave
    labelSelector:
      matchLabels:
        app: redis
    pre:
      - exec:
          container: redis
          command: ["/usr/local/bin/redis-cli", "BGSAVE"]
          timeout: 3m
          onError: Fail
    post:
      - exec:
          container: redis
          command: ["/usr/local/bin/redis-cli", "LASTSAVE"]
          timeout: 30s
