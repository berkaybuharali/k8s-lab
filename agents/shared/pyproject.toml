[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-cake-shared"
version = "0.1.0"
description = "Shared configuration and utilities for Magic Cake agents"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
